name: ec-site

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ec_site
    volumes:
      - mongodb_data:/data/db
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok || quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/ec_site
    command: ["npm", "run", "db:indexes"]
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - database

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      MONGODB_URI: mongodb://mongodb:27017/ec_site
      APP_URL: ${DOCKER_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - edge
      - database
    stop_grace_period: 20s

volumes:
  mongodb_data:

networks:
  edge:
  database:
    internal: true
